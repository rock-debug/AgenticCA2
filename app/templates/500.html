{% extends 'base.html' %}

{% block title %}Internal Error - 500{% endblock %}

{% block content %}
<div class="row justify-content-center my-5 text-center">
    <div class="col-md-6">
        <div class="display-1 text-warning fw-bold mb-3">500</div>
        <h3 class="fw-bold mb-3">Internal Server Error</h3>
        <p class="text-muted mb-4">An unexpected error occurred on the server. Please try again later.</p>
        <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary px-4"><i class="fa-solid fa-house me-2"></i>Return to Dashboard</a>
    </div>
</div>
{% endblock %}
