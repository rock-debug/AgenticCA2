{% extends 'base.html' %}

{% block title %}Access Denied - 403{% endblock %}

{% block content %}
<div class="row justify-content-center my-5 text-center">
    <div class="col-md-6">
        <div class="display-1 text-danger fw-bold mb-3">403</div>
        <h3 class="fw-bold mb-3">Access Forbidden</h3>
        <p class="text-muted mb-4">You do not have permission to access this resource or user data.</p>
        <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary px-4"><i class="fa-solid fa-house me-2"></i>Return to Dashboard</a>
    </div>
</div>
{% endblock %}
