{% extends 'base.html' %}

{% block title %}Page Not Found - 404{% endblock %}

{% block content %}
<div class="row justify-content-center my-5 text-center">
    <div class="col-md-6">
        <div class="display-1 text-primary fw-bold mb-3">404</div>
        <h3 class="fw-bold mb-3">Page Not Found</h3>
        <p class="text-muted mb-4">The requested page or resource could not be found on this server.</p>
        <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary px-4"><i class="fa-solid fa-house me-2"></i>Return to Dashboard</a>
    </div>
</div>
{% endblock %}
